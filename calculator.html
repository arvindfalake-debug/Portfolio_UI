<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="calculator.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">

    <section class="screen" aria-label="Display">
      <p class="screen__expression" id="expression" aria-hidden="true"></p>
      <output class="screen__result" id="result" aria-live="polite">0</output>
    </section>

    <div class="keys" id="keys">
      <button type="button" class="key key--fn"  data-action="clear"     data-key="Escape"    aria-label="Clear all">AC</button>
      <button type="button" class="key key--fn"  data-action="backspace" data-key="Backspace" aria-label="Delete last digit">⌫</button>
      <button type="button" class="key key--fn"  data-action="percent"   data-key="%"         aria-label="Percent">%</button>
      <button type="button" class="key key--op"  data-action="operator"  data-value="/" data-key="/" aria-label="Divide">÷</button>

      <button type="button" class="key" data-action="digit" data-value="7" data-key="7">7</button>
      <button type="button" class="key" data-action="digit" data-value="8" data-key="8">8</button>
      <button type="button" class="key" data-action="digit" data-value="9" data-key="9">9</button>
      <button type="button" class="key key--op"  data-action="operator" data-value="*" data-key="*" aria-label="Multiply">×</button>

      <button type="button" class="key" data-action="digit" data-value="4" data-key="4">4</button>
      <button type="button" class="key" data-action="digit" data-value="5" data-key="5">5</button>
      <button type="button" class="key" data-action="digit" data-value="6" data-key="6">6</button>
      <button type="button" class="key key--op"  data-action="operator" data-value="-" data-key="-" aria-label="Subtract">−</button>

      <button type="button" class="key" data-action="digit" data-value="1" data-key="1">1</button>
      <button type="button" class="key" data-action="digit" data-value="2" data-key="2">2</button>
      <button type="button" class="key" data-action="digit" data-value="3" data-key="3">3</button>
      <button type="button" class="key key--op"  data-action="operator" data-value="+" data-key="+" aria-label="Add">+</button>

      <button type="button" class="key key--fn"  data-action="negate"  aria-label="Change sign">±</button>
      <button type="button" class="key" data-action="digit" data-value="0" data-key="0">0</button>
      <button type="button" class="key" data-action="decimal" data-key="." aria-label="Decimal point">.</button>
      <button type="button" class="key key--equals" data-action="equals" data-key="Enter" aria-label="Equals">=</button>
    </div>

  </main>

  <script src="calculator.js"></script>
</body>
</html>
